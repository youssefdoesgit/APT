<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f1b17"/>
  <!-- crescent -->
  <g transform="translate(330,150)">
    <circle cx="0" cy="0" r="62" fill="#d9b45b"/>
    <circle cx="26" cy="-14" r="54" fill="#0f1b17"/>
  </g>
  <!-- mosque -->
  <g fill="#3ec98a">
    <!-- minarets -->
    <rect x="128" y="250" width="18" height="150" rx="6"/>
    <circle cx="137" cy="248" r="12"/>
    <rect x="366" y="250" width="18" height="150" rx="6"/>
    <circle cx="375" cy="248" r="12"/>
    <!-- main body -->
    <rect x="176" y="300" width="160" height="100" rx="8"/>
    <!-- dome -->
    <path d="M176 300 a80 80 0 0 1 160 0 z"/>
    <!-- finial -->
    <circle cx="256" cy="205" r="9"/>
  </g>
  <!-- door -->
  <rect x="238" y="345" width="36" height="55" rx="18" fill="#0f1b17"/>
  <!-- ground -->
  <rect x="96" y="400" width="320" height="14" rx="7" fill="#294a3e"/>
</svg>
